<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modell-Galerie</title>
  <style>
    html,body{margin:0;height:100%;background:#cfe8f7;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
    canvas{display:block;width:100%;height:100%}
    #ui{position:fixed;left:0;right:0;top:0;padding:8px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
    #ui button{pointer-events:auto;min-height:64px;min-width:64px;padding:0 16px;font-size:18px;border:0;border-radius:16px;background:#fff;box-shadow:0 2px 0 #0003}
    #ui button.on{background:#ffc83d}
    #info{position:fixed;left:8px;bottom:8px;right:8px;background:#fffc;border-radius:12px;padding:8px 12px;font-size:16px}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui"></div>
  <div id="info"></div>
  <script type="module" src="/src/gallery/gallery.js"></script>
</body>
</html>
